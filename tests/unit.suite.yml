# Codeception Test Suite Configuration
#
# Suite for unit or integration tests.

actor: UnitTester
modules:
    enabled:
        - Db:
            dsn: "pgsql:host=%GIGADB_HOST%;dbname=%GIGADB_DB%;port=%GIGADB_PORT%"
            user: "%GIGADB_USER%"
            password: "%GIGADB_PASSWORD%"
            populate: false
            cleanup: true
        - Asserts
        - \Helper\Unit
    step_decorators: ~
bootstrap: bootstrap.php
