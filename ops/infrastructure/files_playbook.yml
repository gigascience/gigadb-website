---
# build a Centos server running a secure Docker CE install

- name: Fix Centos package repos issuess
  hosts: name_gigadb_filesserver_{{gigadb_env}}*
  tags:
    - fix-centos-package-repos-issues
  roles:
    - role: ../../roles/centos-package-repos

- name: Setup Fail2ban
  hosts: name_gigadb_filesserver_{{gigadb_env}}*
  tags:
    - setup-fail2ban

  tasks:
    - debug:
        msg: "remote private ip : {{ ec2_files_private_ip }}"

  roles:
    - role: ../../roles/fail2ban
    - role: ../../roles/jail-ssh

- name: Setup Docker CE
  hosts: name_gigadb_filesserver_{{gigadb_env}}*
  tags:
    - setup-docker-ce
  vars:
    target_host: "_fileserver"

  roles:
    - role: ../../roles/docker-install
    - role: role-secure-docker-daemon
      dds_host: "{{ ec2_files_public_ip }}"
      dds_server_cert_path: /etc/docker
      dds_restart_docker: no
      dds_client_cert_path: /home/ec2-user/.docker
    - role: ../../roles/docker-postinstall
    - role: ../../roles/docker-daemon-enable-start
    - role: ../../roles/fuw


- name: Mount AWS efs access points
  hosts: name_gigadb_filesserver_{{gigadb_env}}*
  become: yes
  tags:
    - mount-efs

  tasks:
    - name: Download custom build aws efs utils binary
      ansible.builtin.get_url:
        url: https://s3.ap-northeast-1.wasabisys.com/infra-resources/amazon-efs-utils-2.0.4-1.el8.x86_64.rpm
        dest: /tmp/aws-efs-utils.rpm

    - name: Install the aws efs utils binary
      dnf:
        name: /tmp/aws-efs-utils.rpm
        state: present
        disable_gpg_check: yes

    - name: Create directories for mounting
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: ec2-user
        group: ec2-user
      loop:
        - "/share/dropbox"
        - "/share/config"

    - name: Mount the dropbox access points
      ansible.posix.mount:
        path: "/share/dropbox"
        src: "{{ efs_filesystem_dns_name }}"
        fstype: efs
        opts: tls,accesspoint={{ dropbox_area_id }}
        state: mounted

    - name: Confirm the dropbox access point is mounted
      ansible.builtin.command:
        cmd: mountpoint /share/dropbox
      register: dropbox_mount_check
      changed_when: false
      failed_when: dropbox_mount_check.stdout == "/share/dropbox is not a mountpoint"

    - name: Mount the config access points
      ansible.posix.mount:
        path: "/share/config"
        src: "{{ efs_filesystem_dns_name }}"
        fstype: efs
        opts: tls,accesspoint={{ configuration_area_id }}
        state: mounted

    - name: Confirm the config access point is mounted
      ansible.builtin.command:
        cmd: mountpoint /share/config
      register: config_mount_check
      changed_when: false
      failed_when: config_mount_check.stdout == "/share/config is not a mountpoint"

    - name: Remove custom build aws efs utils rpm
      ansible.builtin.file:
        path: /tmp/aws-efs-utils.rpm
        state: absent

- name: Configure files container service on the file server
  hosts: name_gigadb_filesserver_{{gigadb_env}}*
  tags:
    - configure-files

  tasks:
  - name: get remote hostname from GitLab CI environment variable
    ansible.builtin.uri:
      url: "{{ gitlab_url }}/variables/remote_fileserver_hostname?filter%5benvironment_scope%5d={{ gigadb_environment }}"
      method: GET
      headers:
        PRIVATE-TOKEN: "{{ gitlab_private_token }}"
      body_format: json
      status_code:
        - 200
    register: remote_fileserver_hostname

  - name: Create docker-compose on the server
    template:
      src: ../../../configuration/file-server/docker-compose.yml.j2
      dest: /home/ec2-user/docker-compose.yml
      owner: ec2-user
      group: ec2-user
      mode: 0644


- name: Install node exporter
  hosts: name_gigadb_filesserver_{{gigadb_env}}*
  tags:
    - node-exporter
  roles:
    - prometheus.prometheus.node_exporter
