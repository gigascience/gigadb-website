check_PSR2:
  stage: conformance and security
  artifacts:
    paths:
      - protected/runtime/phpcs-psr2-source.txt
      - protected/runtime/phpcs-psr2-summary.txt
      - protected/runtime/phpcs-psr2-full.txt
    when: always
    expire_in: 3 months
  script:
    # Load Base image
    - docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
    - docker load -i php-7_1-fpm-buster.tar
    - docker load -i php-7_2-fpm-buster.tar
    - docker load -i php-7_2-cli-buster.tar
    - docker load -i alpine-3_14.tar
    - docker load -i nginx-1_21-alpine.tar
    - docker load -i node-$NODE_VERSION-buster-slim.tar
    # login to gitlab container registry
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/application:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/test:latest || true
    - docker-compose run --rm config
    - docker-compose run --rm gigadb
    - docker-compose run --rm test ops/scripts/check_codestyle.sh
  allow_failure: true
  when: manual

check_PHPDoc:
  stage: conformance and security
  artifacts:
    paths:
      - protected/runtime/phpcs-phpdoc-source.txt
      - protected/runtime/phpcs-phpdoc-summary.txt
      - protected/runtime/phpcs-phpdoc-full.txt
    when: always
    expire_in: 3 months
  script:
    # Load Base image
    - docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
    - docker load -i php-7_1-fpm-buster.tar
    - docker load -i php-7_2-fpm-buster.tar
    - docker load -i php-7_2-cli-buster.tar
    - docker load -i alpine-3_14.tar
    - docker load -i nginx-1_21-alpine.tar
    - docker load -i node-$NODE_VERSION-buster-slim.tar
    # login to gitlab container registry
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/application:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/test:latest || true
    - docker-compose run --rm config
    - docker-compose run --rm gigadb
    - docker-compose run --rm test ops/scripts/check_phpdoc.sh
  allow_failure: true
  when: manual


.check_coverage:
  stage: conformance and security
  cache:
    key: coverage-cache
    paths:
      - previous_coverage_level.txt
  script:
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/application:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/test:latest || true
    - docker-compose run --rm config
    - docker-compose run --rm gigadb
    - docker-compose run --rm test ./tests/coverage_check

semgrep-sast:
  stage: conformance and security

variables:
  CS_ANALYZER_IMAGE: "$CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning:6"
  CS_SCHEMA_MODEL: 15

container_scanning:
  stage: conformance and security
  image: "$CS_ANALYZER_IMAGE$CS_IMAGE_SUFFIX"
  parallel:
    matrix:
      - CS_IMAGE: [
          "registry.gitlab.com/$CI_PROJECT_PATH/production_web:staging",
          "registry.gitlab.com/$CI_PROJECT_PATH/production_app:staging",
          "registry.gitlab.com/$CI_PROJECT_PATH/production_web:live",
          "registry.gitlab.com/$CI_PROJECT_PATH/production_app:live"
        ]
  variables:
    CS_SEVERITY_THRESHOLD: critical
    SECURE_LOG_LEVEL: 'info'
  rules:
    - if: $CONTAINER_SCANNING_DISABLED == 'true' || $CONTAINER_SCANNING_DISABLED == '1'
      when: never
    - if: $CI_COMMIT_BRANCH &&
          $CI_GITLAB_FIPS_MODE == "true" &&
          $CS_ANALYZER_IMAGE !~ /-(fips|ubi)\z/
      variables:
        CS_IMAGE_SUFFIX: -fips
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

docker_scout_scanning:
  image: docker:latest
  stage: conformance and security
  services:
    - docker:dind
  before_script:
    # login to gitlab container registry
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    # Install curl and the Docker Scout CLI
    - |
      apk add --update curl
      curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --
      apk del curl
      rm -rf /var/cache/apk/*
    # Login to Docker Hub required for Docker Scout CLI
    - docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
  script:
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/application:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/test:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/fuw-admin:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/fuw-worker:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/gigadb-worker:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/fuw-public:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/console:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/ftpd:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/watcher:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/tusd:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/beanstalkd:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/web:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/js:latest || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/production_tideways-daemon:staging || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/production_tideways-daemon:live || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/production_web:staging || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/production_web:live || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/production_app:staging || true
    - docker pull registry.gitlab.com/$CI_PROJECT_PATH/production_app:live || true
    # Get a CVE report for the built image and fail the pipeline when critical or high CVEs are detected
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/test:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/application:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/fuw-admin:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/fuw-worker:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/gigadb-worker:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/fuw-public:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/console:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/ftpd:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/watcher:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/tusd:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/beanstalkd:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/web:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/js:latest --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/production_tideways-daemon:staging --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/production_tideways-daemon:live --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/production_web:staging --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/production_web:live --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/production_app:staging --only-severity critical,high
    - docker scout cves registry.gitlab.com/$CI_PROJECT_PATH/production_app:live --only-severity critical,high



