paths:
  tests: tests
  output: tests/_output
  data: tests/_data
  support: tests/_support
  envs: tests/_envs
actor_suffix: Tester
coverage:
  enabled: true
  c3_url: 'http://gigadb.test/index.php'
  html: tests/_output/coverage
  include:
      - protected/models/*.php
      - protected/components/*.php
      - gigadb/app/models/*.php
      - gigadb/app/services/*.php
      - protected/controllers/*.php
      - protected/commands/*.php
      - protected/behaviors/*.php
  exclude:
      - tests/*
      - vendor/*
extensions:
  enabled:
      - Codeception\Extension\RunFailed
params:
    - .env.test
